name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: Code Formatting & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Check Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Arquivos não formatados encontrados:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        go-version: [ "1.22", "1.23" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Parser Tests
        run: go test -v -cover ./internal/parser/...

      - name: Run TurboQuant Tests
        run: go test -v -cover ./internal/turboquant/...

      - name: Run MCP Server Tests
        run: go test -v -cover ./internal/mcp/...

      - name: Run Store Tests
        run: go test -v -cover ./internal/store/...

      - name: Run Canvas Tests
        run: go test -v -cover ./internal/canvas/...

      - name: Run Repo Tests
        run: go test -v -cover ./internal/repo/...

      - name: Run All Pure Tests with Coverage Report (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          go test -v -coverprofile=coverage.txt -covermode=atomic ./internal/parser/... ./internal/turboquant/... ./internal/mcp/... ./internal/store/... ./internal/canvas/... ./internal/repo/...

      - name: Upload Coverage Artifact (Ubuntu)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.go-version }}
          path: coverage.txt
          retention-days: 7

  database-tests:
    name: Database Integration Tests (SQLite & PostgreSQL with pgvector)
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install CGO dependencies (SQLite & GCC)
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev

      - name: Download Go Dependencies
        run: go mod download

      - name: Run SQLite Tests (CGO, FTS5 & sqlite-vec)
        run: CGO_ENABLED=1 go test -v -cover ./internal/db/...

      - name: Run PostgreSQL Integration Tests (pgvector)
        env:
          MY_MEMORY_PG_URL: postgres://testuser:testpassword@localhost:5432/testdb?sslmode=disable
        run: go test -v -run TestPostgresStore_ ./internal/store/...

      - name: Run SQLite & PostgreSQL Combined Coverage
        env:
          MY_MEMORY_PG_URL: postgres://testuser:testpassword@localhost:5432/testdb?sslmode=disable
        run: |
          CGO_ENABLED=1 go test -v -coverprofile=db-coverage.txt -covermode=atomic ./internal/db/... ./internal/store/...

      - name: Upload DB Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-coverage-report
          path: db-coverage.txt
          retention-days: 7

  build-verification:
    name: Build Verification
    needs: [unit-tests, database-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install CGO dependencies (SQLite & GCC)
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev

      - name: Verify CLI Compilation
        run: |
          mkdir -p bin
          CGO_ENABLED=1 go build -v -o bin/mem ./cmd/mem
          ls -lh bin/mem