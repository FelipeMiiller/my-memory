name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  lint:
    name: Code Formatting & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Lê a diretiva `go` do go.mod (1.26.1). Fixar uma versão aqui
          # divergente faz o Go baixar o toolchain correto como módulo
          # (golang.org/toolchain@v0.0.1-go1.26.1), e esse toolchain entra no
          # cache junto com as dependências. O restore do cache então quebrava
          # com `tar: Cannot open: File exists` no job de lint — antes de
          # qualquer teste rodar. Como a versão faz parte da chave do cache,
          # corrigir também invalida o cache envenenado.
          go-version-file: "go.mod"
          cache: true

      - name: Check Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Arquivos não formatados encontrados:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python Release Script Tests
        run: python scripts/release/test_calculate_version.py

  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Parser Tests
        run: go test -v -cover ./internal/parser/...

      - name: Run TurboQuant Tests
        run: go test -v -cover ./internal/turboquant/...

      - name: Run MCP Server Tests
        run: go test -v -cover ./internal/mcp/...

      - name: Run Store Tests
        run: go test -v -cover ./internal/store/...

      - name: Run Canvas Tests
        run: go test -v -cover ./internal/canvas/...

      - name: Run Repo Tests
        run: go test -v -cover ./internal/repo/...

      - name: Run Graph & GraphView Tests
        run: go test -v -cover ./internal/graph/... ./internal/graphview/...

      - name: Run Embedder Tests
        run: go test -v -cover ./internal/embedder/...

      - name: Run Compiler & Config Tests
        run: go test -v -cover ./internal/compiler/... ./internal/config/...

      - name: Run Watcher Tests
        run: go test -v -cover ./internal/watcher/...

      - name: Run Auto-Wiring Tests
        run: go test -v -cover ./internal/autowire/...

      - name: Run Deep Link Tests
        run: go test -v -cover ./internal/deeplink/...

      - name: Run Staleness Tests
        run: go test -v -cover ./internal/staleness/...

      - name: Run Semantic Drift Tests
        run: go test -v -cover ./internal/drift/...

      - name: Run CLI Tests
        run: go test -v -cover ./cmd/mem/...

      # ---------------------------------------------------------------------------
      # Cobertura de pacotes (lacuna fechada em 2026-10-18)
      # ---------------------------------------------------------------------------
      # Estes cinco pacotes NAMO apareciam em nenhum step e portanto nunca eram
      # executados pelo CI, apesar de `go test ./...` local passar. Três deles
      # estão ligados a comandos que o usuario executa (`mem up/down/profiles`,
      # `mem events`, `mem federation`), o que torna o silêncio particularmente
      # caro: um passo verde no CI nao dizia nada sobre eles.
      - name: Run Supervisor Tests
        run: go test -v -cover ./internal/supervisor/...

      - name: Run Event Runtime Tests
        run: go test -v -cover ./internal/event_runtime/...

      - name: Run Federation Tests
        run: go test -v -cover ./internal/federation/...

      - name: Run Daemon Entrypoint Tests (mymemoryd)
        run: go test -v -cover ./cmd/mymemoryd/...

      - name: Run Code AST Benchmark Harness Tests
        run: go test -v -cover ./bench/codeast/...

      # Este step e o unico lugar onde a invariante "todo pacote roda na CI"
      # e realmente executada. Sem ele, remover um step deste arquivo passaria
      # build, vet e a suite inteira (ver internal/ci/ci.go).
      - name: Run CI Coverage Invariant Tests
        run: go test -v -cover ./internal/ci/...

      # Invariante: todo pacote de `go list ./...` aparece em algum step de
      # teste deste arquivo ou na tabela de exclusoes abaixo. Para reauditar:
      #   go list ./... | sed 's|github.com/FelipeMiiller/my-memory||'
      # e conferir pacote a pacote contra os `run:` deste workflow.
      #
      # Tabela de exclusoes: VAZIA. Nenhum pacote de `go list ./...` fica de
      # fora hoje. Pacotes removidos na limpeza (internal/policy, internal/asr,
      # internal/ipc/jsonrpc, internal/writer, internal/writer/projection) e o
      # pacote raiz nao entram nesta lista por nao existirem mais — se um deles
      # voltar ao `go list ./...`, precisa de step de teste de volta.
      #
      # Nao usar `go test ./...` como atalho aqui: o passo de cobertura
      # (abaixo) precisa de uma lista explicita para produzir o
      # coverage-profile, e um `./...` mascararia justamente a regressao que
      # este comentario existe para impedir.

      - name: Run All Pure Tests with Coverage Report (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          go test -v -coverprofile=coverage.txt -covermode=atomic ./internal/parser/... ./internal/turboquant/... ./internal/mcp/... ./internal/store/... ./internal/canvas/... ./internal/repo/... ./internal/graph/... ./internal/graphview/... ./internal/embedder/... ./internal/compiler/... ./internal/config/... ./internal/watcher/... ./internal/autowire/... ./internal/deeplink/... ./internal/staleness/... ./internal/drift/... ./internal/supervisor/... ./internal/event_runtime/... ./internal/federation/... ./internal/ci/... ./cmd/mem/... ./cmd/mymemoryd/... ./bench/codeast/...

      - name: Upload Coverage Artifact (Ubuntu)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.go-version }}
          path: coverage.txt
          retention-days: 7

  database-tests:
    name: Database Integration Tests (SQLite & PostgreSQL with pgvector)
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install CGO dependencies (SQLite & GCC)
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev

      - name: Download Go Dependencies
        run: go mod download

      - name: Run SQLite Tests (CGO, FTS5 & sqlite-vec)
        run: CGO_ENABLED=1 go test -tags "sqlite_fts5" -v -cover ./internal/db/...

      - name: Run PostgreSQL Integration Tests (pgvector)
        env:
          MY_MEMORY_PG_URL: postgres://testuser:testpassword@localhost:5432/testdb?sslmode=disable
        run: go test -v -run TestPostgresStore_ ./internal/store/...

      - name: Run SQLite & PostgreSQL Combined Coverage
        env:
          MY_MEMORY_PG_URL: postgres://testuser:testpassword@localhost:5432/testdb?sslmode=disable
        run: |
          CGO_ENABLED=1 go test -tags "sqlite_fts5" -v -coverprofile=db-coverage.txt -covermode=atomic ./internal/db/... ./internal/store/...

      - name: Upload DB Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-coverage-report
          path: db-coverage.txt
          retention-days: 7

  # ---------------------------------------------------------------------------
  # feat-code-ast / ADR-047 / CA-15: CI matrix CGO on/off for code AST pipeline
  # ---------------------------------------------------------------------------
  # Tree-sitter integration is opt-in via the `treesitter` build tag
  # (//go:build treesitter). Two parallel jobs exercise both paths so that:
  #   * CGO-on  : build with `-tags treesitter`, real backend (when CGO toolchain
  #               is available) or stub backend; tests must cover CA-01..CA-12.
  #   * CGO-off : default build with no tag; code pipeline MUST be no-op and
  #               markdown pipeline MUST keep working (CA-03, CA-14, CA-15).
  # In this branch the tree-sitter binding is still a stub
  # (internal/codeast/treesitter_enabled.go) that compiles without gcc. When
  # the real binding github.com/tree-sitter/go-tree-sitter lands, the
  # CGO-on job will additionally require gcc on Ubuntu (apt: build-essential)
  # and gcc-mingw or MSVC on Windows runners. Failure to find a C compiler
  # must surface as a clear diagnostic, not a silent green.
  codeast-cgo-on:
    name: Code AST Pipeline (CGO on / -tags treesitter)
    # Best-effort: real tree-sitter binding may require a C toolchain not
    # present in every CI image. The default build path stays green so the
    # release pipeline is not blocked by an optional feature.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install C toolchain (gcc) for future real binding
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc
          gcc --version
          echo "CGO_ENABLED=$(go env CGO_ENABLED)"
          echo "CC=$(go env CC)"

      - name: Run Code AST Tests (-tags treesitter)
        run: |
          CGO_ENABLED=1 go test -tags treesitter -v \
            ./internal/codeast/... ./cmd/mem/... ./internal/mcp/... \
            -run 'TestBuildTagIsolatesTreesitter|TestCode|TestMemoryCode|TestSQLCode|TestRanking|TestParser_|TestPipeline|TestCache|TestMockParser|TestLanguageDetection'

      - name: Confirm boot log path
        run: |
          # In the treesitter-tagged build, LogTreesitterBootStatus emits:
          #   "tree-sitter: enabled (stub backend ...)" (or the real backend
          #   message once the binding is injected).
          cat <<'EOF' > /tmp/bootcheck.go
          package main
          import (
              "fmt"
              "github.com/FelipeMiiller/my-memory/internal/codeast"
          )
          func main() {
              fmt.Printf("treesitter enabled=%v\n", codeast.IsTreesitterEnabled())
              codeast.LogTreesitterBootStatus()
          }
          EOF
          # Use the local module via replace directive.
          # The bootstrap module MUST be initialised under the repo module path:
          # Go evaluates the `internal/` visibility rule against the *importing
          # module path*, not the filesystem location, so a bare `bootcheck`
          # module is rejected with
          #   "use of internal package .../internal/codeast not allowed"
          # even when `replace` points at the local checkout.
          mkdir -p /tmp/bootcheck && cd /tmp/bootcheck
          cp /tmp/bootcheck.go main.go
          go mod init github.com/FelipeMiiller/my-memory/bootcheck
          go mod edit -replace github.com/FelipeMiiller/my-memory=$GITHUB_WORKSPACE
          go mod tidy
          go run -tags treesitter .

  codeast-cgo-off:
    name: Code AST Pipeline (CGO off / default build - no-op path)
    # Gating job for CA-03/CA-14/CA-15: the default `go test ./...` (no tag)
    # MUST keep passing without any C toolchain. Code pipeline becomes no-op
    # and emits the one-time boot warning:
    #   "tree-sitter: disabled (code pipeline skipped)".
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run Code AST No-Op Tests (default, no tag)
        run: |
          go test -v ./internal/codeast/... \
            -run 'TestBuildTagIsolatesTreesitter|TestPipelineNoOpWhenTreesitterDisabled'

      - name: Run Full Suite Without treesitter tag (markdown pipeline regression)
        run: |
          # No tag means no CGO requirement. If this fails, the markdown
          # pipeline regressed because of the codeast package additions.
          go test -count=1 ./internal/codeast/...

      - name: Confirm IsTreesitterEnabled returns false on default build
        run: |
          mkdir -p /tmp/bootcheck_off && cd /tmp/bootcheck_off
          cat <<'EOF' > main.go
          package main
          import (
              "fmt"
              "github.com/FelipeMiiller/my-memory/internal/codeast"
          )
          func main() {
              if codeast.IsTreesitterEnabled() {
                  fmt.Println("FAIL: IsTreesitterEnabled()=true without -tags treesitter")
                  return
              }
              fmt.Println("OK: IsTreesitterEnabled()=false on default build")
              codeast.LogTreesitterBootStatus()
          }
          EOF
          # Module path must sit under the repo path for the same `internal/`
          # import rule reason documented in the codeast-cgo-on job.
          go mod init github.com/FelipeMiiller/my-memory/bootcheck_off
          go mod edit -replace github.com/FelipeMiiller/my-memory=$GITHUB_WORKSPACE
          go mod tidy
          go run .

  # ---------------------------------------------------------------------------
  # Frontend (viewer SPA) - ADR-059 / ADR-060
  # ---------------------------------------------------------------------------
  # O job `frontend` que existia foi removido junto com o viewer Electron em
  # b477200, e nunca voltou. Desde a ADR-059 o repositorio tem uma segunda
  # toolchain (Node) em `viewer/`, e sem este job nada garante que
  # `npm run build` passa.
  #
  # O ultimo step e o mais importante: ele roda a invariante de
  # `internal/ci` COM `node_modules` presente. Sem essa combinacao, a
  # invariante roda num checkout limpo, onde `go list ./...` nao enxerga
  # nenhum pacote de terceiro -- e foi exatamente assim que o defeito do
  # commit cee9fb1 escapou: um pacote npm (`flatted`) distribui codigo Go, e
  # `go list ./...` o reportava como pacote deste modulo.
  frontend:
    name: Frontend (viewer SPA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "viewer/package.json"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check bundle size budget
        run: |
          # ADR-060 mediu o stack do frontend em +54,7 kB gzip sobre o
          # baseline de 84,28 kB, com meta de ~139 kB. O orcamento de 180 kB
          # existe para pegar o modo de falha mais provavel: importar o
          # barrel do `zod` em vez de `zod/mini` custa +87,8 kB e passaria
          # despercebida numa review de diff.
          set -euo pipefail
          budget=184320   # 180 kB
          total=0
          for f in dist/assets/*.js; do
            [ -e "$f" ] || continue
            size=$(gzip -9 -c "$f" | wc -c)
            echo "  $f -> $size bytes gzip"
            total=$((total + size))
          done
          echo "Total: $total bytes gzip (budget $budget)"
          if [ "$total" -gt "$budget" ]; then
            echo "FAIL: bundle gzip acima do orcamento de 180 kB"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run CI Coverage Invariant With node_modules Present
        # Caminho ABSOLUTO de proposito. O job tem `defaults.run.working-directory: viewer`,
        # e um `working-directory: .` relativo deixa o diretorio de execucao
        # dependente de como o runner resolve um caminho relativo de step
        # (raiz do workspace ou o default do job). Com `.` resolvido para
        # `viewer/`, o comando abaixo rodaria de dentro de `viewer/` e
        # `go test ./internal/ci/...` nao encontraria o pacote -- o job
        # ficaria vermelho sem exercitar a invariante que ele existe para
        # exercitar. `${{ github.workspace }}` nao tem ambiguidade.
        working-directory: ${{ github.workspace }}
        run: go test -count=1 -v ./internal/ci/...

  build-verification:
    name: Build Verification
    needs: [unit-tests, database-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install CGO dependencies (SQLite & GCC)
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev

      - name: Verify CLI Compilation with Embedded Metadata
        run: |
          mkdir -p bin
          CGO_ENABLED=1 go build -tags "sqlite_fts5" \
            -ldflags "-s -w -X main.Version=v1.0.0-ci -X main.GitCommit=${{ github.sha }} -X main.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -v -o bin/mem ./cmd/mem
          ls -lh bin/mem
          ./bin/mem version
          ./bin/mem version --json